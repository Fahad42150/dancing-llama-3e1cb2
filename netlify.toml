[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/usa-canada-team-store-setup-management"
  to = "/usa-canada-team-store-setup-management/index.html"
  status = 200

[[redirects]]
  from = "/usa-canada-team-store-setup-management/"
  to = "/usa-canada-team-store-setup-management/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
