name: Submit updated URLs to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Read sitemap and verify IndexNow key
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const host = 'www.fjxstudio.com';
          const key = 'f7d6a42c08830e4be2e0083dd5e7eeef';
          const keyLocation = `https://${host}/${key}.txt`;

          (async () => {
            const [keyResponse, sitemapResponse] = await Promise.all([
              fetch(keyLocation),
              fetch(`https://${host}/sitemap.xml`)
            ]);
            if (!keyResponse.ok) throw new Error(`IndexNow key file returned HTTP ${keyResponse.status}`);
            if ((await keyResponse.text()).trim() !== key) throw new Error('IndexNow key file content did not match the configured key.');
            if (!sitemapResponse.ok) throw new Error(`Sitemap returned HTTP ${sitemapResponse.status}`);

            const xml = await sitemapResponse.text();
            const urls = [...xml.matchAll(/<loc>\\s*([^<]+?)\\s*<\\/loc>/gi)]
              .map(match => match[1].trim())
              .filter(url => {
                try {
                  const parsed = new URL(url);
                  return parsed.protocol === 'https:' && parsed.hostname === host;
                } catch {
                  return false;
                }
              });

            if (urls.length === 0) throw new Error('No eligible URLs found in the sitemap.');
            if (urls.length > 10000) throw new Error('Sitemap contains more than the IndexNow 10,000 URL limit.');

            fs.writeFileSync('indexnow-payload.json', JSON.stringify({
              host,
              key,
              keyLocation,
              urlList: [...new Set(urls)]
            }));
            console.log(`Prepared ${new Set(urls).size} URLs for IndexNow submission.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Notify IndexNow (Bing and participating search engines)
        shell: bash
        run: |
          status=$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)
          cat indexnow-response.txt
          echo
          echo "IndexNow HTTP status: $status"
          case "$status" in
            200|202) echo "IndexNow accepted the URL notification." ;;
            *) echo "IndexNow submission was not accepted."; exit 1 ;;
          esac
