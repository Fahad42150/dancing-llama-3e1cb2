name: Submit updated URLs to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment and prepare sitemap URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const host = 'www.fjxstudio.com';
          const key = 'f7d6a42c08830e4be2e0083dd5e7eeef';
          const keyLocation = \`https://\${host}/\${key}.txt\`;

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let keyVerified = false;
            let sitemapXml = '';
            for (let attempt = 1; attempt <= 24; attempt++) {
              try {
                const keyResponse = await fetch(keyLocation, { cache: 'no-store' });
                if (keyResponse.ok && (await keyResponse.text()).trim() === key) {
                  keyVerified = true;
                  const sitemapResponse = await fetch(\`https://\${host}/sitemap.xml\`, { cache: 'no-store' });
                  if (sitemapResponse.ok) {
                    sitemapXml = await sitemapResponse.text();
                    break;
                  }
                }
              } catch (error) {
                console.log(\`Attempt \${attempt}: \${error.message}\`);
              }
              console.log(\`Waiting for Vercel production deployment (attempt \${attempt}/24)...\`);
              await sleep(15000);
            }
            if (!keyVerified) throw new Error('IndexNow key file was not available on the live domain after waiting for deployment.');
            if (!sitemapXml) throw new Error('Live sitemap was not available after waiting for deployment.');

            const urls = [...sitemapXml.matchAll(/<loc>\s*([^<]+?)\s*<\/loc>/gi)]
              .map(match => match[1].trim())
              .filter(url => {
                try {
                  const parsed = new URL(url);
                  return parsed.protocol === 'https:' && parsed.hostname === host;
                } catch {
                  return false;
                }
              });

            const uniqueUrls = [...new Set(urls)];
            if (uniqueUrls.length === 0) throw new Error('No eligible URLs found in the sitemap.');
            if (uniqueUrls.length > 10000) throw new Error('Sitemap contains more than the IndexNow 10,000 URL limit.');

            fs.writeFileSync('indexnow-payload.json', JSON.stringify({
              host,
              key,
              keyLocation,
              urlList: uniqueUrls
            }));
            console.log(\`Prepared \${uniqueUrls.length} URLs for IndexNow submission.\`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Notify IndexNow (Bing and participating search engines)
        shell: bash
        run: |
          status=$(curl --silent --show-error --output indexnow-response.txt --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)
          cat indexnow-response.txt
          echo
          echo "IndexNow HTTP status: $status"
          case "$status" in
            200|202) echo "IndexNow accepted the URL notification." ;;
            *) echo "IndexNow submission was not accepted."; exit 1 ;;
          esac
