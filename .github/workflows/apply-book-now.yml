name: Apply site-wide Book Now CTA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-wide-book-now-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-book-now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Book Now to every standalone HTML page
        run: python scripts/apply-book-now.py
      - name: Commit and push generated page updates
        run: |
          if git diff --quiet; then
            echo "All HTML pages already have the Book Now CTA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Book Now CTA to all standalone pages"
          git pull --rebase origin main
          git push
