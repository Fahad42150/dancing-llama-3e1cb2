name: Verify production build and responsive layouts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-responsive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check generator syntax
        run: |
          node --check scripts/generate-ecommerce-management-pages.mjs
          node --check scripts/generate-online-store-manager-pages.mjs
          node --check scripts/generate-inksoft-team-store-pages.mjs
          node --check scripts/generate-virtual-assistant-website-guides.mjs
          node --check scripts/generate-virtual-assistant-pages.mjs
          node --check scripts/generate-virtual-assistant-blogs.mjs
      - name: Run production build
        run: npm run build
      - name: Install browser test runner
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/fjx-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/fjx-preview.log
          exit 1
      - name: Audit every sitemap page at nine viewport widths
        run: node scripts/audit-responsive-layout.mjs
      - name: Upload responsive audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fjx-responsive-audit
          path: artifacts/responsive-audit.json
          if-no-files-found: warn
